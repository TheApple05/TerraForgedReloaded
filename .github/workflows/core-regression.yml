name: Core regressions (not full port)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernels:
    name: Java 25 utilities / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Verify frozen reference and mutation detection
        run: python tools/verify_core.py --self-test
      - name: Verify future-cache reentry and concurrent publication
        run: python tools/verify_cache.py
      - name: Reject incomplete terrain parity evidence
        run: python tests/terrain/test_compare_terrain_samples.py
